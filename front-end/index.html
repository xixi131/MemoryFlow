<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MemoryFlow</title>
    <link rel="icon" type="image/png" href="/logo-memoryflow.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0064E1",
              "primary-hover": "#0053BD",
              "primary-glow": "#268AEA",
              "background-dark": "#0F172A",
              "surface-dark": "#1E293B", 
              "surface-light": "#334155", 
              "text-secondary": "#94A3B8",
              "accent-coral": "#FF6F61",
              "accent-green": "#4CAF50",
            },
            fontFamily: {
              "display": ["SF Pro Display", "SF Pro Text", "-apple-system", "BlinkMacSystemFont", "Inter", "Plus Jakarta Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", "sans-serif"],
              "body": ["SF Pro Text", "SF Pro Display", "-apple-system", "BlinkMacSystemFont", "Inter", "Plus Jakarta Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", "sans-serif"],
              "mono": ["JetBrains Mono", "monospace"],
            },
            borderRadius: {
              "xl": "1.5rem",
              "2xl": "2rem", 
              "3xl": "2.5rem",
              "pill": "9999px",
            },
            boxShadow: {
              "glow": "0 0 20px -5px rgba(0, 100, 225, 0.5)",
              "inner-light": "inset 0 1px 1px 0 rgba(255, 255, 255, 0.05)",
            }
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'SF Pro Text', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', 'Plus Jakarta Sans', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        /* Global smooth transition for theme switching */
        transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        background-color: transparent !important;
      }
      html {
        background-color: transparent !important;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
      /*
       * 输入框聚焦样式：GitHub / Apple 那种「边框变蓝」，不要外发光。
       * 用 1px outline 画在内侧（offset -1px），这样有边框的输入框看起来就是边框变蓝，
       * 无边框的（药丸输入框那类）也能有一条干净的蓝边，不会撑开布局。
       * Tailwind 的 focus:ring-* 本质是 box-shadow，且 .focus\:ring-2:focus 优先级高于这里，
       * 所以必须 !important 才压得住。
       */
      input:not([type="checkbox"]):not([type="radio"]):focus,
      textarea:focus,
      select:focus,
      .field-control:focus,
      .field-control:focus-visible,
      .field-control[aria-expanded="true"] {
        outline: 2px solid #0064E1 !important;
        outline-offset: -2px !important;
        border-color: #0064E1 !important;
        box-shadow: none !important;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(226, 232, 240, 0.8);
        transition: background-color 0.5s, border-color 0.5s;
      }
      .dark .glass-panel {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .modal-enter {
        animation: modal-pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes modal-pop {
        0% { opacity: 0; transform: scale(0.95) translateY(10px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      /* 鐏靛姩宀涘脊鎬ф敹缂╁姩鐢伙細鍏堢缉灏忓埌姣旂洰鏍囨洿灏忥紝鍐嶅洖寮?*/
      @keyframes squish-in {
        0% { transform: scale(1); }
        60% { transform: scale(0.85); } /* 鏀剁缉寰楁洿鏄庢樉涓€鐐?*/
        80% { transform: scale(1.02); } /* 杞诲井鍙嶅脊 */
        100% { transform: scale(1); }
      }
      /* 鐏靛姩宀涘脊鎬у睍寮€鍔ㄧ敾锛氬睍寮€杩囩▼ -> 鍙樺ぇ(Overshoot) -> 鍙樺皬(Undershoot) -> 鎭㈠ */
      @keyframes squish-out {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); } /* 鍙樺ぇ */
        75% { transform: scale(0.96); } /* 鍙樺皬 */
        100% { transform: scale(1); }   /* 鎭㈠ */
      }
      .animate-squish-in {
        animation: squish-in 1s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .animate-squish-out {
        animation: squish-out 1s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      
      /* Shimmer Effect for Verification Text */
      @keyframes shimmer-text {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .animate-text-shimmer {
        animation: shimmer-text 2s linear infinite;
      }
    </style>


</head>
  <body class="">
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
